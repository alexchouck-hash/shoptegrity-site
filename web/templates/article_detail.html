{% extends "base.html" %}

{% block title %}Field Journal — Shoptegrity{% endblock %}

{% block content %}
<div class="container" style="max-width: 900px; margin: 2rem auto; padding: 0 1.5rem;">

  <nav style="margin-bottom: 1.5rem; font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 0.5rem;">
    <a href="/community" style="color: var(--primary-dark); text-decoration: none; font-weight: 600;">&larr; The Commons</a>
  </nav>

  <article style="background: white; border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem;">
    <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--navy); line-height: 1.25; margin-bottom: 0.75rem;">
      Field Journal
    </h1>
    <p style="font-size: 1.05rem; color: var(--slate); line-height: 1.55; margin: 0;">
      No Field Journal reports are published on this copy of Shoptegrity.
    </p>
  </article>

</div>
{% endblock %}
